name: Find iOS Project

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run build
      - run: npx cap sync ios

      - name: Find iOS workspace
        run: find ios -name "*.xcworkspace" -print
